deployment:
  tasks:
    - export DEPLOYPATH=/home/teketeq9v8o0/repositories/training.teketesafespace.co.za

    # 1. Sync only changed files (fast + safe)
    - /bin/rsync -av --delete \
        --exclude='.env' \
        --exclude='storage/' \
        --exclude='bootstrap/cache/' \
        ./ $DEPLOYPATH

    # 2. Go to project directory
    - cd $DEPLOYPATH

    # 3. Clear old caches (lightweight)
    - /usr/local/bin/php artisan optimize:clear || true
